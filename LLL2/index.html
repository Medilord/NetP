<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="utf-8">
        <title>Лабораторная работа 2</title>
        <script src="Resources/d3.v7.min.js"> </script>
        <script src="JavaScript/main.js"></script>
        <script src="JavaScript/image.js"></script>
        <script src="JavaScript/path.js"></script>
    </head>
    <body>
        <form id="settings" >
            <p id="paths" style="display: none">Пути перемещения<br>
                <select>
                    <option>Буквой «Г»</option>
                    <option>По кругу</option>
                </select>
            </p>

            <p id="coords">Координаты рисунка<br>
                <label for="cx">x: </label>
                <input type="number" id="cx" value="150" max=600 min=0>
                <span class="expand_form"> до <input type="number" id="cx_finish" value="300" max=600 min=0></span><br>
                <label for="cy">y: </label>
                <input type="number" id="cy" value="150" max=600 min=0>
                <span class="expand_form"> до <input type="number" id="cy_finish" value="300" max=600 min=0></span>
            </p>
            <p id="rotation">Поворот<br>
                <label for="ang">угол: </label>
                <input type="number" id="ang" value="180" max=360 min=0>
                <span class="expand_form"> до <input type="number" id="ang_finish" value="360" max=360 min=0></span><br>
            </p>
            <p id="transformation">Трансформация<br>
                <label for="sx">x: </label>
                <input type="number" id="sx" value="1" max=100 min=0>
                <span class="expand_form"> до <input type="number" id="sx_finish" value="2" max=100 min=0></span><br>
                <label for="sy">y: </label>
                <input type="number" id="sy" value="1" max=100 min=0>
                <span class="expand_form"> до <input type="number" id="sy_finish" value="2" max=100 min=0></span><br>
            </p>
            <input type="button" value="Нарисовать">
            <input type="button" value="Очистить">
            <p>
                <input type="checkbox" id="do_animation">
                Включить анимацию?
                <span id="animation_types" class="expand_form">
                    <select id="animations_types_select">
                        <option>linear</option>
                        <option>elastic</option>
                        <option>bounce</option>
                    </select>
                    <br>
                    <input type="checkbox" id="path_animation">
                    Перемещение вдоль пути?
                </span>
            </p>
            <input type="button" value="Анимировать" class="expand_form">
        </form>
        <svg></svg>
    </body>
</html>
